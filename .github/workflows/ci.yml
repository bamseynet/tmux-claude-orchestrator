name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo. No deploy/publish/release steps.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
          shellcheck --version
          shfmt --version

      - name: Discover, syntax-check, and lint shell scripts
        run: |
          # All tracked shell scripts: every *.sh plus the extensionless `orch`
          # entrypoint (a bare *.sh glob would miss it).
          mapfile -t scripts < <({ git ls-files '*.sh'; git ls-files 'orch'; } | sort -u)
          printf 'Found %d shell scripts:\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"

          echo "== bash -n (syntax check, each script) =="
          for f in "${scripts[@]}"; do
            bash -n "$f" && echo "ok: $f"
          done

          echo "== shellcheck (all scripts; uses .shellcheckrc) =="
          shellcheck "${scripts[@]}"

      - name: shfmt formatting diff (advisory, non-blocking)
        continue-on-error: true
        run: |
          mapfile -t scripts < <({ git ls-files '*.sh'; git ls-files 'orch'; } | sort -u)
          # Advisory only: surfaces formatting drift without gating CI. The repo has
          # not adopted a shfmt style, so this never fails the build.
          shfmt -d "${scripts[@]}"

  actionlint:
    name: actionlint (workflow lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          # Pinned binary install (no third-party action), verified against the
          # published checksum. actionlint runs the runner's preinstalled linter
          # over each run block too.
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  test:
    name: bats (hermetic unit tests + mocked tmux/claude smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install bats (pinned)
        env:
          BATS_VERSION: 1.11.0
          BATS_SHA256: aeff09fdc8b0c88b3087c99de00cf549356d7a2f6a69e3fcec5e0e861d2f9063
        run: |
          # Pinned source tarball (no third-party action, no unpinned apt-get),
          # verified against the published checksum — mirrors the actionlint job.
          # bats-core ships no prebuilt binary; its own install.sh lays down the
          # bats/lib/exec scripts under the given prefix.
          curl -fsSL -o bats.tar.gz \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz"
          echo "${BATS_SHA256}  bats.tar.gz" | sha256sum -c -
          tar -xzf bats.tar.gz
          sudo "./bats-core-${BATS_VERSION}/install.sh" /usr/local
          bats --version

      - name: Run bats tests
        run: bats tests/

  bash32:
    name: bash 3.2 compatibility smoke (macOS /bin/bash)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Syntax-check + bootstrap smoke under real bash 3.2 (Docker)
        run: |
          set -euo pipefail
          # #98 shipped a `set -- "${arr[@]}"` empty-array crash that only
          # reproduces on bash < 4.4 (macOS ships bash 3.2). ubuntu-latest's
          # bash is 5.x, so this repo's only way to exercise real 3.2
          # semantics is to run the actual interpreter in a container --
          # the same mechanism #99's regression test (tests/issue98_*.bats)
          # already proved fast (~15s) and reliable on this runner.
          #
          # Pinned by digest (mirrors the actionlint/bats pinning style below).
          docker run --rm -v "$PWD":/repo -w /repo --entrypoint bash \
            bash@sha256:3a13e5da38baa575985778cd09ce8ac736d4b4dafc91a430e71271f6e5311b89 \
            -c '
              set -u
              apk add --no-cache bash git tmux jq perl >/dev/null 2>&1
              git config --global --add safe.directory "*"

              fail=0

              echo "== bash -n syntax check under real bash 3.2 (every tracked script) =="
              # Catches bash4+-only *syntax* repo-wide: ${var^^}/${var,,},
              # declare -A, etc. Cheap parse-time check, not just this repos
              # entrypoint scripts.
              scripts="$(git ls-files "*.sh"; echo orch)"
              for f in $scripts; do
                [ -f "$f" ] || continue
                bash -n "$f" && echo "ok: $f" || { echo "SYNTAX FAIL: $f"; fail=1; }
              done

              echo "== ./orch up bootstrap smoke (the exact code path #98 broke) =="
              # bash -n cannot catch #98s bug class: `"${arr[@]}"` on an EMPTY
              # array under `set -u` is valid syntax, it only crashes at
              # runtime, and only pre-4.4. So actually run the real
              # entrypoint -- both call shapes that hit the empty-array
              # expansion (bare `orch up`, and `--name` which consumes every
              # arg leaving bootstrap_args empty) -- and inspect the output
              # for bash-version-specific failure signatures rather than
              # exit code (a missing `claude`/`jq` dependency in this bare
              # container also exits non-zero, and is expected).
              check_smoke() {
                desc="$1"; shift
                out="$("$@" 2>&1)" || true
                if printf "%s" "$out" | grep -Eq "unbound variable|bad substitution|bad array subscript|declare: usage|declare:.*invalid option|bash: mapfile: command not found|bash: readarray: command not found|syntax error near unexpected token"; then
                  echo "BASH-3.2 INCOMPATIBILITY in: $desc"
                  printf "%s\n" "$out"
                  fail=1
                else
                  echo "ok: $desc"
                fi
              }
              check_smoke "orch up --name X" ./orch up --name ci-bash32-smoke
              check_smoke "orch up (bare)"   ./orch up

              exit "$fail"
            '
