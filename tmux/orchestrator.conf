# tmux/orchestrator.conf — OPTIONAL global ergonomics.
# bootstrap.sh already applies the essential HUD + activity flags SESSION-SCOPED, so
# it never touches your global config. Merge this into ~/.tmux.conf only if you want
# these conveniences everywhere.

# --- core ---
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -g mouse on
set -g history-limit 100000
set -sg escape-time 0
set -g base-index 0
set -g renumber-windows on
set -g focus-events on

# --- prefix Ctrl-a ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- see which worker moved / went quiet ---
setw -g monitor-activity on
set  -g visual-activity off
setw -g window-status-activity-style "fg=yellow,bold"

# --- pane labels = worker id + running command ---
set -g pane-border-status top
set -g pane-border-format " #{window_name} #{pane_current_command} "

# --- quick nav (no prefix) ---
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-h previous-window
bind -n M-l next-window

# --- reload ---
bind r source-file ~/.tmux.conf \; display "reloaded"

# NOTE: HUD status-right is set per-session by bootstrap.sh (needs the toolkit's
# absolute path). If you want it global, point it at your install, e.g.:
#   set -g status-right "#(/path/to/repo/_orch/hud.sh)  #S %H:%M"
